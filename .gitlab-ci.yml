include:
  - template: "Jobs/Code-Quality.gitlab-ci.yml"
  - template: "Security/SAST.gitlab-ci.yml"
  - project: 'paysafe/ci-cd/pipeline-templates'
    file: '/jobs/ci/gitlab/gitlab-provided-images.yml'
  - project: 'paysafe/ci-cd/pipeline-templates'
    file: '/jobs/ci/gitlab/security/sast/common.yml'
  - project: 'paysafe/ci-cd/pipeline-templates'
    file: '/jobs/ci/gitlab/security/dependency-scan/common.yml'

stages:
  - code-quality
  - test
  - publish

code_quality:
  stage: code-quality
  image: "${RUNNER_IMAGE_REGISTRY}/gitlab/executor/ci/build-docker:0.0.6"
  services:
    - name: "${RUNNER_IMAGE_REGISTRY}/docker:23.0.6-dind"
      alias: docker
  variables:
    # See: https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#docker-in-docker-with-tls-enabled-in-kubernetes
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    ECR_REGION: "eu-west-1"
    AWS_ECR_URL: "${RUNNER_IMAGE_REGISTRY}"
    CODE_QUALITY_IMAGE: "${RUNNER_IMAGE_REGISTRY}/gitlab/ci-cd/codequality:0.96.0"
    CODE_QUALITY_BUILD_DIR: "."

  before_script:
    - aws ecr get-login-password --region "${ECR_REGION}" | docker login -u AWS --password-stdin "${AWS_ECR_URL}"
    - echo "Files to be scanned"
    - find .

  after_script:
    - docker logout;
  rules: [ if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH  == "master"' ]

sonarqube-check:
  stage: code-quality
  image: '${RUNNER_IMAGE_REGISTRY}/gitlab/executor/ci/build-marketing:0.2.5'
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  cache:
    - key: '$CI_JOB_NAME'
      paths:
        - .sonar/cache
      when: 'always'
  script:
    - sonar-scanner -Dsonar.qualitygate.wait=true -Dsonar.host.url="${SONAR_URL}" -Dsonar.login="${SONAR_TOKEN}"
  allow_failure: true
  rules: [ if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH  == "master"' ]

sast:
  stage: code-quality

dependency_scanning:
  stage: code-quality

test:
  stage: test
  allow_failure: true
  rules: [ if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH  == "master"' ]

  image: '${RUNNER_IMAGE_REGISTRY}/gitlab/executor/ci/build-marketing-php-7:0.1.6'
  cache:
    key: vendor
    paths:
      - vendor/

  before_script:
    - apt-get update && apt-get install -y unzip
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --prefer-dist --no-progress --no-suggest

  script:
    ./vendor/bin/phpunit --coverage-clover=coverage.xml

e2e-test:
  stage: test
  allow_failure: true
  rules: [ if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH  == "master"' ]

  image: '${RUNNER_IMAGE_REGISTRY}/gitlab/executor/ci/build-marketing-php-7:0.1.6'
  cache:
    key: vendor
    paths:
      - vendor/

  before_script:
    - apt-get update && apt-get install -y unzip
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --prefer-dist --no-progress --no-suggest

  script:
    ./vendor/bin/phpunit --configuration=phpunit.e2e.xml

mirror_to_github:
  stage: publish
  image: "${RUNNER_IMAGE_REGISTRY}/gitlab/executor/ci/build-docker:1.1.0"
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    GITHUB_PROJECT_NAME: paysafe-payments-api-sdk-php
    GITHUB_USER_EMAIL: svc_github_mirror@paysafe.com
    GITHUB_USER_NAME: SVC_GITHUB_MIRROR

  when:
    manual
  rules: [ if: '$CI_COMMIT_BRANCH  == "master"' ]
  allow_failure: true
  script:
    - |
      set -euo pipefail

      echo "Starting mirror to GitHub"

      VERSION_FILE="./src/VERSION"
      if [[ ! -f "$VERSION_FILE" ]]; then
        echo "Error: Version file not found at ${VERSION_FILE}" >&2
        exit 1
      fi

      VERSION="$(< "$VERSION_FILE")"
      echo "Version: ${VERSION}"

      if [[ "$VERSION" == *-SNAPSHOT ]]; then
        echo "Error: Snapshot versions cannot be mirrored" >&2
        exit 1
      fi

      GITHUB_URL="https://${GITHUB_USER_NAME}:${GITHUB_ACCESS_TOKEN}@github.com/paysafegroup/${GITHUB_PROJECT_NAME}"

      git config user.email "${GITHUB_USER_EMAIL}"
      git config user.name "${GITHUB_USER_NAME}"

      # Pull latest GitLab master content that we want to publish.
      git fetch origin master
      git checkout -B master origin/master

      # Configure GitHub remote.
      git remote add github "${GITHUB_URL}" 2>/dev/null || git remote set-url github "${GITHUB_URL}"

      # IMPORTANT: base release branch on GitHub main to preserve redacted GitHub history.
      if git ls-remote --heads github main | grep -q main; then
        git fetch github main
        git checkout -B release_branch github/main
      else
        git checkout --orphan release_branch
      fi

      # Start from a clean index/worktree in release branch.
      git rm -r --cached . 2>/dev/null || true
      git clean -fd

      # Bring in current publishable content from GitLab master.
      git checkout master -- .

      # Exclude internal/non-public artifacts from mirrored repository.
      git rm --cached --ignore-unmatch sonar-project.properties
      git rm --cached --ignore-unmatch phpunit.e2e.xml
      git rm -r --cached --ignore-unmatch tests/E2e

      git add -A

      if git diff --cached --quiet; then
        echo "No changes detected - nothing to push."
        exit 0
      fi

      MESSAGE="[$(date +'%Y-%m-%d')] Release ${VERSION}"
      GIT_TAG="v${VERSION}"

      echo "Committing and pushing to GitHub..."
      git commit -m "${MESSAGE}"
      git tag -f -a "${GIT_TAG}" -m "${MESSAGE}"
      git push github release_branch:main
      git push --force github "${GIT_TAG}"

      echo "Mirroring completed"
