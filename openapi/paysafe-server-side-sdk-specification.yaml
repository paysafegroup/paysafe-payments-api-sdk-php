              $ref: '#/components/schemas/CurrencyCode'
            txnTime:
              type: string
              format: date-time
              description: The date and time of the transaction
            status:
              $ref: '#/components/schemas/RefundStatus'
              description: The status of the refund transaction.
              readOnly: true
            gatewayReconciliationId:
              type: string
