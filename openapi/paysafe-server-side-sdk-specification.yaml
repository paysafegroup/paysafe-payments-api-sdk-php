    PaymentRequest:
      x-package: Payment
      description: Represents the body of a payment request.
      type: object
      additionalProperties: true
      required:
        - merchantRefNum
        - amount
        - currencyCode
        - paymentHandleToken
      properties:
        merchantRefNum:
          type: string
          description: The merchant reference number created by the merchant and submitted as part of the request
        amount:
          type: integer
          description: The amount of the request, in minor units (e.g., $10.99 = 1099)
          maximum: 99999999999
        dupCheck:
          type: boolean
          description: This validates that this request is not a duplicate.
          default: true
        settleWithAuth:
          type: boolean
          description: This indicates whether the request is an Authorization only (no Settlement), or a Purchase (Authorization and Settlement).
        paymentHandleToken:
          type: string
          description: This is the payment token generated by Paysafe that will be used for the Payment request.
        customerIp:
          type: string
          description: The IP address of the customer making the payment
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        preAuth:
          type: boolean
          description: |-
            This indicates whether the Authorization request should be sent as a Pre-Authorization. <br>
            **Note:** You should use the preAuth element in cases where you are not sure that you can fully settle the Authorization within 4 days. Contact your account manager for more information.
        description:
          type: string
          description: Description of the transaction provided by the merchant.
          maxLength: 255
        partialAuth:
          $ref: '#/components/schemas/PartialAuth'
        level2level3:
          $ref: '#/components/schemas/Level2Level3'
