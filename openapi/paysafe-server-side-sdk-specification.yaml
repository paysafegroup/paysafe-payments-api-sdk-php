          maxLength: 2048
        colorDepthBits:
          $ref: '#/components/schemas/BrowserColorDepth'
        javaEnabled:
          type: boolean
          description: Indicates if Java is enabled in the browser
        javaScriptEnabled:
          type: boolean
          description: Indicates if JavaScript is enabled in the browser
        language:
          type: string
          description: The browser language
          maxLength: 8
        screenHeight:
          type: integer
          description: The screen height in pixels
          minimum: 0
          maximum: 9999
        screenWidth:
          type: integer
          description: The screen width in pixels
          minimum: 0
          maximum: 9999
        timeZoneOffset:
          type: integer
          description: This is the date and time the request was processed. The ISO 8601 date format is expected, i.e., YYYY-MM-DD-THH:MM:SSZ.
        userAgent:
