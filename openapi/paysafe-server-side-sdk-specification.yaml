    # Additional Payment-related Models
    Level2Level3:
      x-package: Card
      type: object
      description: |-
        Level 2 and Level 3 (L2/L3) credit card processing refers to certain B2B card transactions for which the merchant might be eligible for lower credit card interchange rates. The lower rates may be available for merchants who provide more detailed information when processing card-not-present transactions. In order to be eligible for L2/L3 transactions:
  
        - Your merchant account must be properly configured by Paysafe.
  
        - The BIN of the credit card used for the transaction must be eligible – typically, these are government-issued credit cards.
  
        **Note:** Not all processing gateways support this parameter. Contact your account manager for more information.
      properties:
        exemptLocalTax:
          type: boolean
          description: |-
            This indicates whether or not local tax is exempted for the request. If set to true, then the 
            localTaxAmount parameter will be ignored.
            **Note:** This value defaults to false
          default: false
        localTaxAmount:
          type: integer
          description: This is the local sales tax applied to the purchase, in minor units
        nationalTaxAmount:
          type: integer
          description: This is the national tax included in the transaction amount, in minor units
        freightAmount:
          type: integer
          description: This is the freight or shipping cost included in the transaction amount, in minor units
        dutyAmount:
          type: integer
          description: This is the duty associated with the import of the purchased goods, in minor units
        destinationZip:
          type: string
          description: This is the postal/zip code of the address to which the purchased goods will be delivered. This field can be identical to the shipFromZip if the customer is present and takes immediate possession of the goods
        destinationCountry:
          type: string
          description: This is the country to which the goods are being shipped
        shipFromZip:
          type: string
          description: This is the postal/zip code of the address from which the purchased goods are being shipped
        lineItems:
          $ref: '#/components/schemas/LineItems'

    LineItems:
      x-package: Card
      description: |-
        This is more detailed information about the items that are being purchased for Level2Level3 merchants.
        This class is typically used for creating detailed receipts or invoices that include itemized purchases, taxes and total costs.
      type: object
      properties:
        description:
          type: string
          description: This is a description of the item(s) being purchased
        productCode:
          type: string
          description: This is the merchant-defined description code of the item being purchased.
        quantity:
          type: integer
          description: This is the quantity of the item. Note - Max 4 decimals is allowed
          maximum: 99999999999
        unitAmount:
          type: integer
          description: This is the unit price of the item being purchased, in minor units. The currency will be based on the account setting
          maximum: 99999999999
        taxRate:
          type: integer
          description: This is the tax rate used to calculate the tax amount. For example, if the tax rate is 10.5%, this value should be 10.5. Note - Max 2 decimals allowed
          maximum: 100
        taxAmount:
          type: integer
          description: This is the amount of any value-added taxes that can be associated with the purchased item, in minor units. The currency will be based on the account setting. Note - Our system will not validate the accuracy of this value. The merchant's application must calculate this value correctly
          maximum: 99999999999
        totalAmount:
          type: integer
          description: This is the total amount of the line item, typically calculated as price multiplied by quantity, in minor units. The currency is based on the account setting. Note - Our system will not validate the accuracy of this value. The merchant's application must calculate this value correctly
          maximum: 99999999999

    AccordD:
      x-package: Card
      description: |-
        Parameters for financing plans supported for certain merchant configurations. Include this element only when instructed to do so by your account manager.
  
        **Note:** Not all processing gateways support this parameter.
      type: object
      properties:
        financingType:
          $ref: '#/components/schemas/AccordDFinancingType'
        plan:
          type: string
          description: This is the plan number for this financing transaction.
          example: '124'
          maxLength: 3
        gracePeriod:
          type: integer
          description: 'This is the grace period, in months, associated with deferred payment transactions.'
          example: 12
          maximum: 99
        term:
          type: integer
          description: 'This is the number of payments, in months, for equal payment transactions.'
          example: 12
          maximum: 99

    Recipient:
      x-package: Card
      description: |-
        'The recipient is deemed to be the person or party who has the contractual relationship with the merchant / financial institution. This may
        be different from the cardholder, e.g., in the case of a parent topping up a child's savings account. Therefore, the fields should not be
        collected on the same page as cardholder information, but instead be passed in the background from the merchant's records.
  
        **Note:** You can include recipient elements in your [authorization request](https://developer.paysafe.com/en/cards-api/#/operations/authorization) **only if** your Merchant Category Code is **6012** and your registered trading address is in the United Kingdom. All fields are optional. However, scheme fines may apply if data is consistently not supplied and chargebacks persist. If you have any questions, contact your account manager. If you are using a payment token for an 
        Authorization request and there is already recipient data for the consumer profile associated with the payment token, then if you include
        the recipient object in the Authorization, this data will override the recipient data already in the profile.
  
        If you [look up an authorization request](https://developer.paysafe.com/en/cards-api/#/operations/get-authorization) that used the visaAdditionalAuthData parameter (now deprecated), the response will contain the
        relevant data in both the recipient and the visaAdditionalAuthData objects.'
      type: object
      properties:
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
        lastName:
          type: string
          maxLength: 255
          description: |-
            'This is the recipient's last name.
            **Note:** Only the first 6 characters are sent to the banking network.'
        accountNumber:
          type: string
          maxLength: 25
          description: |-
            'This is the recipient's account number, e.g., a loan agreement number or customer ID. In the case where the recipient account is a prepaid card, the card number may be sent in full.
            **Note:** Only the first 6 and last 4 characters are sent to the banking network and will be masked accordingly within the back office and any other reports, to comply with PCI regulations.'
        zip:
          type: string
          maxLength: 10
          description: Postal/ZIP code of the recipient

    StoredCredential:
      x-package: Common
      description: |-
        'The storedCredential object is used to identify [authorization requests] that use stored credentials for a consumer, in order to improve authorization rates and reduce fraud. Stored credentials can be used in two cases:
        - Using a payment token : An authorization request that uses a paymentToken from the [Customer Vault API]
        - Using a card number : An authorization request that uses a credit card number stored by the merchant.
        **Notes:**
        - If you use a paymentToken in the authorization request but do not include the storedCredential object, Paysafe will provide default information taken from Customer Vault data.
        - You cannot include both the storedCredential object and the recurring parameter in the same authorization request. Paysafe recommends using the storedCredential object.
        - The cvv parameter of the [card object] is required when the occurrence parameteris set to INITIAL. However, cvv is not required when the occurrence parameter is set to SUBSEQUENT.
        - The storedCredential object cannot be used for Apple Pay or Google Pay transactions.'
      type: object
      properties:
        type:
          $ref: '#/components/schemas/StoredCredentialType'
        occurrence:
          $ref: '#/components/schemas/StoredCredentialOccurrence'
        initialTransactionId:
          type: string
          maxLength: 36
          description: |-
            'Id of the initial Recurring Payment transaction. This id should be stored from the auth response of the transaction indicated as initial with the following: type=RECURRING/TOPUP/ADHOC, occurrence=INITIAL. This reference should be provided when:
              - type = RECURRING and occurrence = SUBSEQUENT
              - type = TOPUP and occurrence = SUBSEQUENT
              - type = ADHOC and occurrence = SUBSEQUENT
            **Note:** This reference is a must to meet PSD 2 authentication process requirements for merchant initiated transactions successfully.'
        externalInitialTransactionId:
          type: string
          maxLength: 256
          description: |-
            'Card Scheme Transaction Id of the initial payment transaction in the recurring plan when it was processed through external service provider. This reference should be provided only when:
              - type=RECURRING and occurrence=SUBSEQUENT
              - type=TOPUP and occurrence=SUBSEQUENT
            **Note:** This reference cannot be provided along with initialTransactionId.
  
            Expected format by scheme (examples):
              - Amex: 15 digits (for example, 012345678901234)
              - Mastercard: 9 characters + 4 digits + 2 spaces (for example, MCC9999991231 )
              - Visa: 15 digits (for example, 306123456789012)
            '

    FundingTransaction:
      x-package: Card
      description: |-
        The fundingTransaction object is used to identify authorization requests that are categorized as funding transactions by the merchant in order to provide additional information for the purpose of a transaction. It can be used by merchants registered with MCC 4722, 4829, 6012, 6051, 6211, 6540, 7800, 7801, 7802, 7994, 7995 or 9406. The relevant value will be assigned automatically by the Payments API as per the merchant registration with card schemes and his applicable MCC.
  
        **Funding Transaction Type Mappings:**
  
        | Funding Transaction Type | Visa | Mastercard |
        |--------------------------|------|------------|
        | SVDW_FUNDS_TRANSFER | Applicable for 4722, 4829, 6012, 6051, 6211 and 6540 | Applicable for 4829, 6540, 6051, 6211, 7800, 7801, 7802, 7994, 7995, 9406 |
        | SDW_WALLET_TRANSFER | Applicable for 4829, 6012 and 6051 | Applicable for 6540, 6051, 6211, 7800, 7801, 7802, 7994, 7995, 9406 |
        | ACCOUNT_TO_ACCOUNT | Applicable for 4829, 6012 and 6211 | Not applicable |
        | PERSON_TO_PERSON | Applicable for 4829 and 6012 | Applicable for 6540, 4829 |
  
        **Notes:**
  
        - The transactionIntent property is used to identify the intent of the authorization requests. This field is mandatory for Visa card - cross-border fundingTransactions where the recipient is from any of the following countries: India, Bangladesh, Argentina, and Egypt.
  
        - If you want to support Visa AFT and Mastercard Funding, you should perform registration with the Card schemes in advance. Please contact Paysafe's operational support or your account manager in order to receive more information and to begin with the registration process. Please note also that not every processor supports funding transactions for all MCCs listed here.
  
        - If you send fundingTransaction type value in the authorization request, you must also send profile and billingDetails, as described below: Profile: firstName, lastName, merchantCustomerId; Billing Details: street, city, state (If US or Canada), country, zip. If not, the funding transaction will be declined due to missing data.
  
        - If you send fundingTransaction type value in the authorization request, but your acquirer doesn't support funding transactions, or your account is not configured (you have not performed the registration process), the transaction will be declined with error: 5040.
  
        - If you send fundingTransaction type in the authorization request with a value not applicable for your MCC, the transaction will be declined with error: 3068.
  
        - If you send fundingTransaction type in the authorization request with a value applicable for your MCC, but not for your VISA direct configuration, the transaction will be declined with error 3069.
  
        - If you send fundingTransaction type in the authorization request with a value not part of the list, the transaction will be declined with error: 5068.
  
        - If you send fundingTransaction type value in the authorization request and your account is configured to process funding transactions, but you are not registered to process funding transactions to a specific card brand, the transaction will be successfully processed and processorAppliedType in the response will be 'NOT_APPLIED'.
  
        - Suppose you send fundingTransaction type value in the authorization request, and your account is configured to process funding transactions. You are registered to process funding transactions to the respective card brand. In that case, the transaction will be successfully processed, and the processorAppliedType will be equal to the fundingTransaction type provided in the request.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/FundingTransactionType'
        processorAppliedType:
          $ref: '#/components/schemas/FundingTransactionType'
          readOnly: true

    FundingTransactionType:
      x-package: Card.Enums
      description: |-
        Enum representing the various processor applied types for funding transactions. The fundingTransaction processorAppliedType value is chosen by Paysafe based on the merchant configuration. It is equal to the one which is used by Paysafe based on your MCC and registration. If you provide value which is applicable for your MCC but you have been registered for another use case, Paysafe will assign the value you have registered for as use case and will provide it into the response as processorAppliedType. In case the merchant is not registered in the relevant card scheme system, the processorAppliedValue received into the response will be 'NOT_APPLIED'. The processorAppliedType can be seen in the auth response.
      type: string
      enum:
        - SVDW_FUNDS_TRANSFER
        - SDW_WALLET_TRANSFER
        - ACCOUNT_TO_ACCOUNT
        - PERSON_TO_PERSON
        - NOT_APPLIED

    # Refund Models
    RefundRequest:
      x-package: Refund
      description: Represents a refund request.
      type: object
      additionalProperties: true
      required:
        - merchantRefNum
        - amount
      properties:
        merchantRefNum:
          type: string
          description: The merchant reference number created by the merchant and submitted as part of the request. It must be unique for each request
        amount:
          type: integer
          description: The amount to refund in minor units (e.g., $10.99 = 1099)
          maximum: 99999999999
        dupCheck:
          type: boolean
          description: Validates that this request is not a duplicate
          default: true
        customerAccountId:
          type: string
          description: This is the account identifier to which the refund will be sent. It is only used today for PaysafeCard. The merchant may pass either the PaysafeCard Account ID of the account to which the refund should be made, or the email address that is registered against the customer’s PaysafeCard account.
