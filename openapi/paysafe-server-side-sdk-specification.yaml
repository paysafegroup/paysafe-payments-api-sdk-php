    CardAuthentication:
      x-package: Card
      description: 3D Secure authentication details for card transactions when using your own 3D Secure service provider
      type: object
      properties:
        id:
          type: string
          description: 'This is the ID of authentication, returned in the response.'
          readOnly: true
        eci:
          type: string
          description: This is the Electronic Commerce Indicator code, which gets returned by the card issuer indicating whether the cardholder was successfully authenticated. Note that in some cases the eci value includes a leading zero, e.g., 01 or 02.
            **Visa**
            - 5 - Identifies a successfully authenticated transaction.
            - 6 - Identifies an attempts authenticated transaction.
            - 7 - Identifies a non-authenticated transaction.
            **Mastercard**
            - 2 - Identifies a successfully authenticated transaction.
            - 1 - Identifies an attempts authenticated transaction.
            - 0 - Identifies a non-authenticated transaction.
        cavv:
          type: string
          description: Cardholder Authentication Verification Value
          example: "AAABCZIhcQAAAABZlyFxAAAAAAA"
          maxLength: 80
        xid:
          type: string
          description: This is the transaction identifier returned by the card issuer.
          example: aWg4N1ZZOE53TkFrazJuMmkyRDA=
          maxLength: 40
          readOnly: true
        status:
          $ref: '#/components/schemas/AuthenticationStatus'
          readOnly: true
        threeDResult:
          $ref: '#/components/schemas/ThreeDResult'
        directoryServerTransactionId:
          type: string
          description: |-
            This is the unique directory server transaction ID required for Mastercard. <br>
            **Note:** This is field is required when the card brand is Mastercard. This exists only for 3D Secure 2. <br>
          example: 123e4567-e89b-12d3-a456-426655445674
          maxLength: 36
        threeDSecureVersion:
          type: string
          description: This is the 3D secure protocol version.
          example: 2.1.0
          maxLength: 8
          minLength: 5
        exemptionIndicator:
          $ref: '#/components/schemas/ThreeDsExemptionIndicator'
        error:
          $ref: '#/components/schemas/Error'

