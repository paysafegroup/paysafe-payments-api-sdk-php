      type: string
      enum:
        - ALIAS_REGULAR
        - ALIAS_AUTODEPOSIT

    InteracFraudStatus:
      x-package: Lpm.Enums
      description: |-
        This is the status of the Standalone Interac's Credit call response. Possible values for the fraud status:
        - CONFIRM_FRAUD - payment is confirmed fraud
        - CONFIRM_LEGITIMATE - payment is confirmed legitimate
        - SCAM - payment is scam
        - PRESUME_LEGITIMATE - payment is presume legitimate
        - SUSPICIOUS - payment is suspicious
      type: string
      enum:
        - CONFIRM_FRAUD
        - CONFIRM_LEGITIMATE
        - SCAM
        - PRESUME_LEGITIMATE
        - SUSPICIOUS

    InteracFraudType:
      x-package: Lpm.Enums
      description: |-
        This is the type of fraudulent transaction that was carried out with the intention of financial gain. Possible values for the fraud type:
        - ACCOUNT_TAKEOVER - Account Takeover
        - BAD_DEPOSIT - Proceeds of Bad Deposit
        - FIRST_PARTY_FRAUD - First Party Fraud
        - INTERCEPTED_PAYMENT - Intercepted Transfer
        - MERCHANT_DISPUTE - Merchant Dispute
        - FAMILY_FRIEND_FRAUD - Family/Friendly Fraud
        - BUSINESS_EMAIL_COMPROMISE - Business Email Compromise
        - VENDOR_EMAIL_COMPROMISE - Vendor Email Compromise
        - MALWARE - Malware
        - APPLICATION_FRAUD - Application Fraud
        - FRAUD_BUSINESS - Fraudulent Business
        - OTHER - Other fraud type
      type: string
      enum:
        - ACCOUNT_TAKEOVER
        - BAD_DEPOSIT
        - FIRST_PARTY_FRAUD
        - INTERCEPTED_PAYMENT
        - MERCHANT_DISPUTE
        - FAMILY_FRIEND_FRAUD
        - BUSINESS_EMAIL_COMPROMISE
        - VENDOR_EMAIL_COMPROMISE
        - MALWARE
        - APPLICATION_FRAUD
        - FRAUD_BUSINESS
        - OTHER

