components:
  schemas:
    ErrorResponse:
      x-package: Common.Error
      type: object
      description: 'Error returned as json.'
      properties:
        error:
          $ref: '#/components/schemas/Error'

    BaseApiResponse:
      description: Represents the base for every response object.
      x-no-builder: true
      type: object
      discriminator:
        propertyName: objectType
        mapping:
          Payment: '#/components/schemas/Payment'
          PaymentHandle: '#/components/schemas/PaymentHandle'
          Customer: '#/components/schemas/Customer'
          Verification: '#/components/schemas/Verification'
          VoidAuthorization: '#/components/schemas/VoidAuthorization'
          Settlement: '#/components/schemas/Settlement'
          Refund: '#/components/schemas/Refund'
      properties:
        error:
          $ref: '#/components/schemas/Error'

    Payment:
      x-package: Payment
      description: Represents the response of a payment transaction.
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            id:
              type: string
              description: The unique identifier for the payment transaction, can be used to retrieve the payment details using the Get Payment API.
              maxLength: 36
              readOnly: true
            merchantRefNum:
              type: string
              description: The merchant reference number created by the merchant and submitted as part of the request
              maxLength: 255
            amount:
              type: integer
              description: The amount of the request, in minor units (e.g., $10.99 = 1099)
              maximum: 99999999999
            dupCheck:
              type: boolean
              description: This validates that this request is not a duplicate. A duplicate request is when the merchantRefNum has already been used in a previous request within the past 90 days.
            settleWithAuth:
              type: boolean
              description: |-
                This indicates whether the request is an Authorization only (no Settlement), or a Purchase (Authorization and Settlement).
                <ul>
                <li>false - The request is not settled </li>
                <li>true - The request is settled </li>
                </ul>
                <b>Note:</b> Defaults to false for cards and true for APMs.
            paymentHandleToken:
              type: string
              description: |-
                This is the payment token generated by Paysafe that will be used for the Payment request.
                For Payment, Payment handle must be in PAYABLE state.
              maxLength: 36
            customerIp:
              type: string
              description: The IP address of the customer making the payment
            currencyCode:
              $ref: '#/components/schemas/CurrencyCode'
            card:
              $ref: '#/components/schemas/TokenizedCardDetails'
            threeDs:
              $ref: '#/components/schemas/ThreeDs'
            authentication:
              $ref: '#/components/schemas/Authentication'
            preAuth:
              type: boolean
              description: Flag indicating whether this is a pre-authorization transaction
            paymentHandleTokenFrom:
              type: string
              description: |-
                This is used in Saved card flow. You will pass this parameter when you want to create single use payment handle using the Saved-card (card-on-file) present in Paysafe customer vault. <br>
                This is an existing multi-use [Customer Payment Handle](/operations/create-payment-handle-for-customer), from which the payment instrument details and profile details are retrieved. <br>
                If this parameter is included then you can omit the billingDetails object. If you send a new billingDetails along with "paymentHandleTokenFrom" then new billingDetails will be considered for the transaction, however no change will be made in the billingDetails present against the Saved-card in customer vault.
            transactionIntent:
              $ref: '#/components/schemas/TransactionIntent'
              description: The intent of the transaction
            gatewayResponse:
              $ref: '#/components/schemas/GatewayResponse'
              description: |-
                This is the read-only raw response returned by an acquirer or PSP. It contains the response code, message, and other details.
            sourceOfFunds:
              $ref: '#/components/schemas/SourceOfFunds'
            # Alternative payment methods
            skrill:
              $ref: '#/components/schemas/Skrill'
            neteller:
              $ref: '#/components/schemas/Neteller'
            paysafecash:
              $ref: '#/components/schemas/Paysafecash'
