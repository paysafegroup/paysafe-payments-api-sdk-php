    # Travel-related models
    AirlineTravelDetails:
      x-package: Common.Travel.Airline
      description: |-
        Contains information about your airline travel.
        <br>**Note:** This object is only for Airline Merchants.
        <br>**Note:** This field has to be passed only in case of card transactions.
      type: object
      properties:
        passengerNameRecord:
          type: string
          description: The airline company uses the passengerNameRecord as a reservation number
        passengerName:
          type: string
          description: Name of the passenger to whom the ticket was issued
        departureDate:
          type: string
          format: date
          description: Date of passenger's departure. Date format YYYY-MM-DD, ISO 8601 expected. For example 2022-12-20
        origin:
          type: string
          description: Origin airport code (IATA Airport Code)
        computerizedReservationSystem:
          $ref: '#/components/schemas/ComputerizedReservationSystem'
        additionalBookingReference:
          type: string
          description: Additional booking reference information
          maxLength: 50
        totalFare:
          type: integer
          description: Total fare amount in minor units
          maximum: 999999999999
        totalFee:
          type: integer
          description: Total fee amount in minor units
          maximum: 999999999999
        totalTaxes:
          type: integer
          description: Total taxes amount in minor units
          maximum: 999999999999
        ticket:
          $ref: '#/components/schemas/AirlineTicket'
        passengers:
          $ref: '#/components/schemas/Passengers'
        customerReferenceNumber:
          type: string
          description: Contains the code that the cardholder supplied to the card acceptor
        travelAgency:
          $ref: '#/components/schemas/TravelAgency'
        tripLegs:
          $ref: '#/components/schemas/AirlineTripLegs'

    LodgingDetails:
      x-package: Common.Travel.Lodging
      description: |-
        Contains information about lodging details.
        <br>**Note:** This object is only for Lodging Merchants.
        <br>**Note:** This field has to be passed only in case of card transactions.
      type: object
      properties:
        hotelFolioNumber:
          type: string
          description: |-
            The card acceptor’s internal invoice or billing ID reference number. Required during settlement
          example: Customer Folio Number
          maxLength: 25
        checkInDate:
          type: string
          format: date
          description: |-
            The arrival date.
            Date format = YYYY-MM-DD, ISO 8601 expected. For example 2023-12-20.
            * Required during settlement.
          example: '2023-12-15'
        checkOutDate:
          type: string
          format: date
          example: '2023-12-20'
          description: |-
            The departure date.
            Date format = YYYY-MM-DD, ISO 8601 expected. For example 2023-12-20.
            * Required during settlement.
        customerServicePhone:
          type: string
          description: |-
            Merchant phone number that the cardholder may call for service. Allowed numeric characters only.
            * Required during settlement request with Visa or Mastercard for integration with TSYS processor
          maxLength: 10
          example: '8311234567'
          pattern: \d
        propertyLocalPhone:
          type: string
          description: |-
            The lodging property location's phone number. Allowed numeric characters only.
            * Required during settlement requests with Mastercard for integration with TSYS processor
          maxLength: 10
          example: '8311234567'
          pattern: \d
        extraCharges:
          type: array
          description: Indicates if the reservation includes additional ancillary charges.
          items:
            $ref: '#/components/schemas/ExtraChargesType'
        roomRate:
          type: integer
          description: |-
            The nightly rate for one room at the lodging property.
            * Required during settlement request with Amex for integration with TSYS processor
          example: 200
          maximum: 999999999999
        programCode:
          $ref: '#/components/schemas/LodgingProgramCode'
        numberOfNights:
          type: integer
          maximum: 99
          description: |-
            The total number of nights the room is booked for.
            * Required during authorization request with Visa for integration with TSYS processor
            * Required during settlement request with Amex for integration with TSYS processor
          example: 5
        isFireSafetyActCompliant:
          type: boolean
          description: |-
            Identifies that the facility complies with the Hotel and Motel Fire Safety Act of 1990. Possible values:
            - true
            - false

    CarRentalDetails:
      x-package: Common.Travel.CarRental
      description: |-
        Contains information about your car rental.
        <br>**Note:** This object is only for Car rental Merchants.
        <br>**Note:** This field has to be passed only in case of card transactions.
      type: object
      properties:
        rentalAgreementNumber:
          type: string
          description: The rental agreement number for the car rental. Required during settlement
          maxLength: 9
        renterName:
          type: string
          description: The name of the person renting the car. Required during settlement request with Mastercard or Amex for integration with TSYS processor
          maxLength: 20
        rentalDays:
          type: integer
          description: The total number of days the car is rented for. Required during authorization request for integration with TSYS processor
          minimum: 1
          maximum: 99
        noShow:
          type: boolean
          description: Indicates if the customer didn't check in for their booking. true if the customer didn't check in, false if the customer checked in
        extraCharges:
          type: array
          description: Indicates if the reservation includes additional ancillary charges
          items:
            $ref: '#/components/schemas/CarRentalExtraChargeType'
        customerServicePhone:
          type: string
          description: Customer service phone number
          maxLength: 10
        returnDetails:
          $ref: '#/components/schemas/CarRentalReturnDetails'
        pickupDetails:
          $ref: '#/components/schemas/CarRentalPickupDetails'
        vehicleClass:
          $ref: '#/components/schemas/VehicleClass'

    CruiselineTravelDetails:
      x-package: Common.Travel.Cruise
      description: |-
        Contains information about your cruise line travel.
        <br>**Note:** This object is only for Cruise line Merchants.
        <br>**Note:** This field has to be passed only in case of card transactions.
      type: object
      properties:
        cruiseShipName:
          type: string
          maxLength: 20
          description: |-
            The ship name booked for the cruise.
            * Required during settlement request with AMEX for integration with TSYS processor
          example: Cruise Ship
        passengerName:
          type: string
          maxLength: 20
          description: |-
            Name of the passenger to whom the ticket was issued.
            * Required during authorization request with AMEX for integration or TSYS processor
            * Required during settlement request with Visa or Mastercard for integration with TSYS processor
          example: John Doe
        departureDate:
          type: string
          format: date
          description: |-
            Date of passenger's departure. Date format = YYYY-MM-DD, ISO 8601 expected.
            * Required during authorization request with AMEX for integration with TSYS processor
            * Required during settlement request for integration with TSYS processor
            _UTC Date Format_
          example: '2023-12-15'
        returnDate:
          type: string
          format: date
          example: '2023-12-20'
          description: |-
            Date of passenger's return. Date format = YYYY-MM-DD, ISO 8601 expected.
            * Required during settlement request with AMEX for integration with TSYS processor
            _UTC Date Format_
        country:
          type: string
          description: |-
            This field contains the country code of the cruise location.
  
            See [Country Codes](https://developer.paysafe.com/en/support/reference-information/codes/#country-codes).
  
            * Required during settlement request with AMEX for integration with TSYS processor
          minLength: 2
          maxLength: 2
          example: US
        state:
          type: string
          description: |-
            The region code that corresponds to the state, province, or other country subdivision of the cruise location.
  
            See [Province Codes](https://developer.paysafe.com/en/support/reference-information/codes/#province-codes) or [State Codes](https://developer.paysafe.com/en/support/reference-information/codes/#state-codes) for Canada or the United States.
  
            * Required during settlement request with AMEX for integration with TSYS processor
          maxLength: 3
          example: CA
          minLength: 2
        originCity:
          type: string
          description: |-
            Departure City where the trip originates.
  
            * Required for AMEX in case of integration with TSYS processor
          example: Barbados
          maxLength: 18
        roomRate:
          type: number
          description: |-
            Total cost of the cruise. For onboard purchases or transactions occurring during cruise travel, this field must be zero filled.
  
            * Required during settlement request with AMEX for integration with TSYS processor
          example: '1200'
          maximum: 999999999999
        travelPackageApplication:
          $ref: '#/components/schemas/TravelPackageApplication'
          example: CAR_RENTAL_RESERVATION
        ticket:
          $ref: '#/components/schemas/CruiselineTicket'
        passengers:
          $ref: '#/components/schemas/Passengers'
        tripLegs:
          $ref: '#/components/schemas/CruiselineTripLegs'

