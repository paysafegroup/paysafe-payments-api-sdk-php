openapi: 3.0.3

info:
  title: Paysafe Payments API
  description: API for processing payments with Paysafe.
  version: 1.0.0
  contact:
    name: Paysafe Support

servers:
  - url: https://api.paysafe.com/paymenthub/v1
    description: Production API
  - url: https://api.test.paysafe.com/paymenthub/v1
    description: Test API

tags:
  - name: Payments
    description: Payment operations
  - name: Refunds
    description: Refund operations
  - name: Verifications
    description: Verification operations
  - name: Settlements
    description: Settlement operations
  - name: Customers
    description: Customer operations
  - name: Void Authorizations
    description: Void Authorization operations
  - name: Standalone Credits
    description: Standalone Credit operations
  - name: Original Credits
    description: Original Credit operations

security:
  - basicAuth: []
  - apiKeyAuth: []

paths:
  /payments:
    post:
      tags:
        - Payments
      summary: Process a payment
      description: Submit a payment request for processing.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    get:
      tags:
        - Payments
      summary: Get payments by merchant reference number
      description: |-
        Gets the payment using merchant reference number with optional filtering by date range and pagination.
      operationId: getPaymentsUsingMerchantReferenceNumber
      parameters:
        - name: merchantRefNum
          in: query
          required: false
          description: Unique merchant reference number created by the merchant and submitted as part of the request when creating payment
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: |-
            This is the start date in UTC. If null is provided, default value (30 days before the end date) will be used.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: |-
            This is the end date in UTC. If null is provided, current date will be used.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: |-
            This is the total number of records to return. If null is provided, default value (10) will be used.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: |-
            This is the starting position, where 0 is the first record. If null is provided, default value (0) will be used.
          schema:
            type: integer
      responses:
        '200':
          description: Payments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /payments/{id}:
    get:
      tags:
        - Payments
      summary: Get payment details
      description: Retrieve details of a specific payment.
      operationId: getPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Payment not found
        '500':
          description: Internal server error
    put:
      tags:
        - Payments
      summary: Cancel a payment
      description: |-
        Cancels a payment using a specific paymentId.
      operationId: cancelPayment
      parameters:
        - name: id
          in: path
          required: true
          description: The unique ID of the payment to cancel
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Payment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Payment not found
        '500':
          description: Internal server error

  /paymenthandles:
    post:
      tags:
        - Payment Handles
      summary: Create a payment handle
      description: Create a payment handle to tokenize payment information.
      operationId: createPaymentHandle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentHandleRequest'
      responses:
        '200':
          description: Payment handle created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHandle'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    get:
      tags:
        - Payment Handles
      summary: Get payment handles by merchant reference number
      description: |-
        Gets the payment handle using merchant reference number with optional filtering by date range and pagination.
      operationId: getPaymentHandlesUsingMerchantReferenceNumber
      parameters:
        - name: merchantRefNum
          in: query
          required: false
          description: Unique merchant reference number created by the merchant and submitted as part of the request when creating payment handle
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: |-
            This is the start date in UTC. If null is provided, default value (30 days before the end date) will be used.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: |-
            This is the end date in UTC. If null is provided, current date will be used.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: |-
            This is the total number of records to return. If null is provided, default value (10) will be used.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: |-
            This is the starting position, where 0 is the first record. If null is provided, default value (0) will be used.
          schema:
            type: integer
      responses:
        '200':
          description: Payment handles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHandleList'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /paymenthandles/{id}:
    get:
      tags:
        - Payment Handles
      summary: Get payment handle details
      description: Retrieve details of a specific payment handle.
      operationId: getPaymentHandle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment handle details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHandle'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Payment handle not found
        '500':
          description: Internal server error

  /settlements/{settlementId}/refunds:
    post:
      tags:
        - Refunds
      summary: Process a refund
      description: Submit a refund request for processing.
      operationId: createRefund
      parameters:
        - name: settlementId
          in: path
          required: true
          description: The ID of the settlement for which the refund is being made
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Refund processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    get:
      tags:
        - Refunds
      summary: Get refunds by merchant reference number
      description: |-
        Gets refunds using the merchant reference number with optional filtering by date range and pagination.
      operationId: getRefundUsingMerchantReferenceNumber
      parameters:
        - name: settlementId
          in: path
          required: true
          description: The ID of the settlement
          schema:
            type: string
        - name: merchantRefNum
          in: query
          required: false
          description: Unique merchant reference number created by the merchant and submitted as part of the request when creating refund
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: |-
            This is the start date in UTC. If null is provided, default value (30 days before the end date) will be used.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: |-
            This is the end date in UTC. If null is provided, current date will be used.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: |-
            This is the total number of records to return. If null is provided, default value (10) will be used.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: |-
            This is the starting position, where 0 is the first record. If null is provided, default value (0) will be used.
          schema:
            type: integer
      responses:
        '200':
          description: Refunds retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundList'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '404':
          description: Settlement not found
        '500':
          description: Internal server error

  /settlements/{settlementId}/refunds/{id}:
    get:
      tags:
        - Refunds
      summary: Get refund details
      description: Retrieve details of a specific refund.
      operationId: getRefund
      parameters:
        - name: settlementId
          in: path
          required: true
          description: The ID of the settlement
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: The ID of the refund
          schema:
            type: string
      responses:
        '200':
          description: Refund details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Refund not found
        '500':
          description: Internal server error
    put:
      tags:
        - Refunds
      summary: Cancel a refund
      description: |-
        Cancels a specific refund by its unique ID.
        **Note:** You can cancel a Refund only if the payment type is CARD and the status is PENDING.
      operationId: cancelRefund
      parameters:
        - name: settlementId
          in: path
          required: true
          description: The ID of the settlement
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: The ID of the refund to cancel
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Refund cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Refund not found
        '500':
          description: Internal server error

  /verifications:
    post:
      tags:
        - Verifications
      summary: Perform a verification
      description: Submit a verification request.
      operationId: createVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Verification processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    get:
      tags:
        - Verifications
      summary: Get verifications by merchant reference number
      description: |-
        Gets the verification using merchant reference number with optional filtering by date range and pagination.
      operationId: getVerificationUsingMerchantReferenceNumber
      parameters:
        - name: merchantRefNum
          in: query
          required: false
          description: Unique merchant reference number created by the merchant and submitted as part of the request when creating verification
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: |-
            This is the start date in UTC. If null is provided, default value (30 days before the end date) will be used.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: |-
            This is the end date in UTC. If null is provided, current date will be used.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: |-
            This is the total number of records to return. If null is provided, default value (10) will be used.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: |-
            This is the starting position, where 0 is the first record. If null is provided, default value (0) will be used.
          schema:
            type: integer
      responses:
        '200':
          description: Verifications retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationList'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /verifications/{id}:
    get:
      tags:
        - Verifications
      summary: Get verification details
      description: Gets the details of a verification for a specific payment type by its unique ID.
      operationId: getVerificationById
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the verification
          schema:
            type: string
      responses:
        '200':
          description: Verification details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Verification not found
        '500':
          description: Internal server error

  /payments/{paymentId}/voidauths:
    post:
      tags:
        - Void Authorizations
      summary: Void an authorization
      description: |-
        Void an authorization for a given paymentId.
        A Void Authorization request allows you to void (or cancel) an authorization request, provided the authorization has not yet been settled.
        An authorization is part of a payment request. This is only applicable when settleWithAuth is set to false in the payment request.
        If settleWithAuth is set to true in the payment request, then the authorization and settlement are completed in the same request.
        In that case you would not be able to process a Void Authorization.
      operationId: voidAuthorization
      parameters:
        - name: paymentId
          in: path
          required: true
          description: The ID of the payment for which the authorization is being voided
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidAuthorizationRequest'
      responses:
        '200':
          description: Void authorization processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidAuthorization'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '404':
          description: Payment not found
        '500':
          description: Internal server error
    get:
      tags:
        - Void Authorizations
      summary: Get void authorizations by merchant reference number
      description: |-
        Gets void authorizations using the merchant reference number with optional filtering by date range and pagination.
      operationId: getVoidAuthorizationUsingMerchantReferenceNumber
      parameters:
        - name: paymentId
          in: path
          required: true
          description: The ID of the payment
          schema:
            type: string
        - name: merchantRefNum
          in: query
          required: false
          description: Unique merchant reference number created by the merchant and submitted as part of the request when creating void authorization
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: |-
            This is the start date in UTC. If null is provided, default value (30 days before the end date) will be used.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: |-
            This is the end date in UTC. If null is provided, current date will be used.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: |-
            This is the total number of records to return. If null is provided, default value (10) will be used.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: |-
            This is the starting position, where 0 is the first record. If null is provided, default value (0) will be used.
          schema:
            type: integer
      responses:
        '200':
          description: Void authorizations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidAuthorizationsList'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '404':
          description: Payment not found
        '500':
          description: Internal server error

  /payments/{paymentId}/voidauths/{id}:
    get:
      tags:
        - Void Authorizations
      summary: Get void authorization details
      description: Gets the details of a void authorization by its ID.
      operationId: getVoidAuthorizationById
      parameters:
        - name: paymentId
          in: path
          required: true
          description: The ID of the payment
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: The ID of the Void Authorization to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Void authorization details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidAuthorization'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Void authorization not found
        '500':
          description: Internal server error

  /standalonecredits:
    post:
      tags:
        - Standalone Credits
      summary: Process a standalone credit transaction
      description: |-
        Processes a Standalone Credit transaction.
      operationId: processStandaloneCredit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandaloneCreditRequest'
      responses:
        '200':
          description: Standalone credit processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneCredit'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    get:
      tags:
        - Standalone Credits
      summary: Get standalone credits by merchant reference number
      description: |-
        Gets standalone credits using the merchant reference number with optional filtering by date range and pagination.
      operationId: getStandaloneCreditUsingMerchantReferenceNumber
      parameters:
        - name: merchantRefNum
          in: query
          required: false
          description: The merchant reference number used in the transactions
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: |-
            The start date for filtering transactions. If null is provided, default value (30 days before the end date) will be used.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: |-
            The end date for filtering transactions. If null is provided, current date will be used.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: |-
            The maximum number of records to return. If null is provided, default value (10) will be used.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: |-
            The pagination offset. If null is provided, default value (0) will be used.
          schema:
            type: integer
      responses:
        '200':
          description: Standalone credits retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneCreditList'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /standalonecredits/{id}:
    get:
      tags:
        - Standalone Credits
      summary: Get standalone credit details
      description: Gets a standalone credit using the given standaloneCreditId.
      operationId: getStandaloneCreditById
      parameters:
        - name: id
          in: path
          required: true
          description: The ID returned in the response of the Standalone Credit request
          schema:
            type: string
      responses:
        '200':
          description: Standalone credit details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneCredit'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Standalone credit not found
        '500':
          description: Internal server error
    put:
      tags:
        - Standalone Credits
      summary: Cancel a standalone credit
      description: Cancels a standalone credit using the given standaloneCreditId.
      operationId: cancelStandaloneCredit
      parameters:
        - name: id
          in: path
          required: true
          description: The unique ID of the Standalone Credit, returned in the original response
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Standalone credit cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Standalone credit not found
        '500':
          description: Internal server error
    patch:
      tags:
        - Standalone Credits
      summary: Update standalone credit status for Interac fraud
      description: |-
        Updates a Standalone Credit using the Interac e-Transfer Fraud API.
      operationId: patchStandaloneCreditStatusForInteracFraud
      parameters:
        - name: id
          in: path
          required: true
          description: The unique ID of the Standalone Credit to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandaloneCreditUpdateRequest'
      responses:
        '200':
          description: Standalone credit updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneCredit'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Standalone credit not found
        '500':
          description: Internal server error

  /originalcredits:
    post:
      tags:
        - Original Credits
      summary: Process an original credit transaction
      description: |-
        Processes an Original Credit transaction for a merchant.
        Original Credits allow merchants with specific merchant category codes (MCCs) to issue winnings as credits to cardholders, without requiring a previous transaction.
      operationId: processOriginalCredit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OriginalCreditRequest'
      responses:
        '200':
          description: Original credit processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OriginalCredit'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    get:
      tags:
        - Original Credits
      summary: Get original credits by merchant reference number
      description: |-
        Gets the details of one or more Original Credit transactions using the merchant reference number.
      operationId: getOriginalCreditUsingMerchantReferenceNumber
      parameters:
        - name: merchantRefNum
          in: query
          required: false
          description: Unique merchant reference number created by the merchant and submitted as part of the original credit request
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: |-
            The start date in UTC. If null is provided, the default value (30 days before the end date) will be used.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: |-
            The end date in UTC. If null is provided, the current date will be used.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: |-
            The total number of records to return. If null is provided, the default value (10) will be used.
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: |-
