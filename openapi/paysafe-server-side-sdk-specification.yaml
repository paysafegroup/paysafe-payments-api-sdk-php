          type: string
          description: The version of the SDK being used
        sdkReferenceNumber:
          type: string
          description: The SDK reference number
        applicationId:
          type: string
          description: The identifier for the application making the request
        deviceIp:
          type: string
          description: The IP address of the device
        deviceFingerprint:
          type: string
          description: The fingerprint of the device
        deviceLocation:
          type: string
          description: The location of the device

    Paypal:
      x-package: Lpm
      description: These are the details of the PayPal account used for the transaction.
      type: object
      properties:
        consumerId:
          type: string
          description: The email address of the consumer or payer
          minLength: 1
          maxLength: 50
        recipientDescription:
          type: string
          description: |-
            A label that overrides the business name in the merchant's PayPal account on the PayPal checkout pages
          minLength: 1
          maxLength: 127
        language:
          $ref: '#/components/schemas/LanguageCode'
          description: |-
            The 2-character preferred language code for the consumer (e.g. AU, AT, BE, BR, CA, CH, CN, DE, ES, GB, FR, IT, NL, PL, PT, RU, or US)
            or a five-character code is also valid for languages in these countries (e.g. da_DK, he_IL, id_ID, ja_JP, no_NO, pt_BR, ru_RU, sv_SE, th_TH, zh_CN, zh_HK, and zh_TW)
        shippingPreference:
          $ref: '#/components/schemas/PaypalShippingReference'
          description: |-
            The shipping preference.
            - NO_SHIPPING - Redacts the shipping address from the PayPal pages. Recommended for digital goods.
            - GET_FROM_FILE - Uses the customer-selected shipping address on PayPal pages.
            - SET_PROVIDED_ADDRESS - If available, uses the merchant-provided shipping address, which the customer cannot change on the PayPal pages.
            If the merchant does not provide an address, the customer can enter the address on PayPal pages.
        consumerMessage:
          type: string
          description: Note to be displayed on the PayPal page
          minLength: 1
          maxLength: 4000
        orderDescription:
          type: string
          description: |-
            Order description to display on PayPal page. If merchant does not set this field it defaults to 'Payment for order'
          minLength: 1
          maxLength: 127
        recipientType:
          $ref: '#/components/schemas/RecipientType'
          description: |-
            Type of payout recipient. The only supported value is 'PAYPAL_ID'

    LanguageCode:
      x-package: Lpm.Enums
      description: |-
        The 2-character preferred language code for the consumer (e.g., AU, AT, BE, BR, CA, CH, CN, DE, ES, GB, FR, IT, NL, PL, PT, RU, or US)
        A five-character code is also valid for following languages (e.g: da_DK, he_IL, id_ID, ja_JP, no_NO, pt_BR, ru_RU, sv_SE, th_TH,
        zh_CN, zh_HK, and zh_TW)
      type: string
      enum:
        - AT
        - AU
        - BE
        - BR
        - CA
        - CH
        - CN
        - DE
        - EN
        - ES
        - FR
        - GB
        - IT
        - NL
        - PL
        - PT
        - RU
        - US
        - da_DK
        - he_IL
        - id_ID
        - ja_JP
        - no_NO
        - pt_BR
        - ru_RU
        - sv_SE
        - th_TH
        - zh_CN
        - zh_HK
        - zh_TW

    PaypalShippingReference:
      x-package: Lpm.Enums
      description: |-
        The shipping preference. The possible values are:
        - NO_SHIPPING - Redacts the shipping address from the PayPal pages. Recommended for digital goods.
        - GET_FROM_FILE - Uses the customer-selected shipping address on PayPal pages.
        - SET_PROVIDED_ADDRESS - If available, uses the merchant-provided shipping address, which the customer cannot change on the PayPal pages.
        If the merchant does not provide an address, the customer can enter the address on PayPal pages.
      type: string
      enum:
        - GET_FROM_FILE
        - NO_SHIPPING
        - SET_PROVIDED_ADDRESS

    RecipientType:
      x-package: Lpm.Enums
