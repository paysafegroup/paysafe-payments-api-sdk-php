        merchant_id:
          type: string
          description: Skrill Merchant ID
          example: dbd6119f4eaa71f50ae4b0762bb41e44
          readOnly: true
        payerName:
          type: string
          maxLength: 100
          description: |-
            The customer's account name after successful payment.
            **Note:** Supported Payment Method: EPS
          example: John Doe
          readOnly: true
        payerIban:
          type: string
          maxLength: 40
          description: |-
            The customer's IBAN after successful payment.
            **Note:** Supported Payment Method: EPS
          example: ITxxxxxxxxxxxxxxxxxxxxxx456
          readOnly: true
        sid:
          type: string
          description: Skrll session id during which transaction is completed
          example: 5deccf822c2a2cf3a91074f50bcafba1
          readOnly: true

    NetworkToken:
