    Splitpay:
      x-package: Lpm
      description: |-
        This object should be used only for Splitpay transactions. It is an array containing the linked accounts and the amount shared with each.
        You must include either amount or percent. However, you cannot include both values.
      type: object
      properties:
        linkedAccount:
          type: string
          description: This is the ID of the linked account. This account must already be linked to the merchant account.
