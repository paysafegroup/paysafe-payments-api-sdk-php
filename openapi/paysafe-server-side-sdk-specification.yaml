        This is the link type that allows different endpoints to be targeted depending on the end state of the transaction.
      type: string
      enum:
        - redirect_payment
        - redirect_registration
        - on_completed
        - default
        - on_failed
        - on_cancelled

    BrowserDetails:
      x-package: Card.Threeds
      description: Details about the customer's browser.
      type: object
