        isCobranded:
          type: boolean
          description: Boolean value whether the card is cobranded
        cobrandName:
          type: string
          description: The name of the cobrand
          example: Interac

    ApplePayTokenDetails:
      x-package: ApplePay
      description: |-
        Apple Pay token information. Returned when the stored payment method is an Apple Pay token and token_type is APPLE_PAY.
      type: object
