        - USER_ID
        - EMAIL
        - PHONE

    Skrill:
      x-package: Lpm
      description: These are the details of the customer used for the transaction.
      type: object
      properties:
        consumerId:
          type: string
          description: |-
            This is the email address of the customer who is making or receiving the payment. This is to be provided by merchant.
            This is sent as "pay_from_email" to Skrill
        emailSubject:
          type: string
          description: |-
            **Note:** Mandatory field for payout only. This is the Subject line to use in the customer email.
            This is to be provided by merchant while making a payout
        emailMessage:
          type: string
          description: |-
            **Note:** Mandatory field for payout. This is the message to use in the customer email. This is to be provided by merchant while making a payout
        recipientDescription:
          type: string
          description: |-
            This is a description to be shown on the Skrill payment page in the logo area if there is no logo url parameter.
            If no value is submitted and there is no logo, the pay_to_email value is shown as the recipient of the payment
        language:
          $ref: '#/components/schemas/LanguageCode'
          description: |-
            The 2-character preferred language code for the consumer (e.g. AU, AT, BE, BR, CA, CH, CN, DE, ES, GB, FR, IT, NL, PL, PT, RU, or US)
            or a five-character code is also valid for languages in these countries (e.g. da_DK, he_IL, id_ID, ja_JP, no_NO, pt_BR, ru_RU, sv_SE, th_TH, zh_CN, zh_HK, and zh_TW)
        logoUrl:
          type: string
          description: |-
            This is the URL of the logo that you would like to appear in the top right of the Skrill. The logo must be accessible via HTTPS or it will not be shown.
            The logo will be resized to fit. To avoid scaling distortion, the minimum size should be as follows:
            If the logo width is greater than height - at least 107px wide.
            If logo width is greater than height - at least 65px high.
            Avoid large images (much greater than 256 by 256px) to minimize the page loading time
        detail1Description:
          type: string
          description: You can show additional details about the product in the More information section in the header
        detail1Text:
          type: string
          description: |-
            The detail1Text is shown next to the detail1Description in the More Information section in the header of the payment form with the other payment details.
            The detail1Description combined with the detail1Text is shown in the more information field of the merchant account history CSV file
        countryCode:
          type: string
          description: This is Customer's country of residence
          minLength: 2
          maxLength: 2

    Neteller:
      x-package: Lpm
      description: Neteller details to be used for the request.
      type: object
      properties:
        consumerId:
          type: string
          description: |-
            This is the email address of the customer who is making or receiving the payment. This is to be provided by merchant while making a payout
          maxLength: 50
        recipientDescription:
          type: string
          description: |-
            This is a description to be shown on the Skrill payment page in the logo area if there is no logo url parameter.
            If no value is submitted and there is no logo, the pay_to_email value is shown as the recipient of the payment
          maxLength: 30
        logoUrl:
          type: string
          description: Neteller logo url

    Paysafecard:
      x-package: Lpm
      description: These are the details of the paysafecard used for the transaction.
      type: object
      required:
        - consumerId
      properties:
        consumerId:
          type: string
          description: |-
            This is the merchant's unique identifier of the customer. For security purposes, if any personal data is used
            (for example, customer's user name, email address, etc.), it has to be encrypted or hashed. **Mandatory.**
          minLength: 1
          maxLength: 50
        minAgeRestriction:
          type: integer
          description: |-
            Payment can be restricted for a certain minimum consumer age (implicitly restricts payment to registered consumers only)
        kycLevelRestriction:
          $ref: '#/components/schemas/KeyLevelRestriction'
          description: |-
            Payment can be restricted for a certain minimum kyc level (implicitly restricts payment to registered consumers only)
        countryRestriction:
          type: string
          description: |-
            This is the code of the country to which the transaction will be restricted. Optional.
            See [Country codes](https://developer.paysafe.com/en/support/reference-information/codes/#country-codes)
          minLength: 2
          maxLength: 2
        submerchantId:
          type: string
          description: |-
            The Submerchant Id (Reporting Criteria) is used to classify sub-merchants at PaysafeCard side

    KeyLevelRestriction:
      x-package: Lpm.Enums
      description: |-
        Payment can be restricted for a certain minimum kyc level (implicitly restricts payment to registered consumers only).
        Possible values are:
        - FULL
        - SIMPLE
      type: string
      enum:
        - FULL
        - SIMPLE

    Paysafecash:
      x-package: Lpm
      description: These are the details of the paysafecash account used for the transaction.
      type: object
      required:
        - consumerId
      properties:
        consumerId:
          type: string
          description: |-
            This is the merchant's unique identifier of the customer. For security purposes, if any personal data is used (for example, customer's user name,
            email address, etc.), it has to be encrypted or hashed. Mandatory.
          minLength: 1
          maxLength: 50
        minAgeRestriction:
          type: integer
          description: |-
            Payment can be restricted for a certain minimum consumer age (implicitly restricts payment to registered consumers only)
        kycLevelRestriction:
          $ref: '#/components/schemas/KeyLevelRestriction'
          description: |-
            Payment can be restricted for a certain minimum kyc level (implicitly restricts payment to registered consumers only)
        countryRestriction:
          type: string
          description: |-
            This is the code of the country to which the transaction will be restricted.
            See [Country codes](https://developer.paysafe.com/en/support/reference-information/codes/#country-codes)
            **Optional, length=2**
          minLength: 2
          maxLength: 2
        expirationTime:
          type: integer
          description: |-
            This is barcode expiration time in minutes at Paysafecash end.
            **Minimum: 5**
          minimum: 5

    Venmo:
      x-package: Lpm
      description: Venmo.
      type: object
      properties:
        consumerId:
          type: string
          description: |-
            This is your identifier for your consumer and must be unique per consumer. We store this after your first successful Venmo transaction for a given
            consumer (during this first transaction the consumer agrees to link their Venmo wallet for future transactions). When you subsequently send in the
            same consumerId, we debit the consumer's wallet directly without the consumer having to agree to each transaction
          minLength: 1
          maxLength: 50
        merchantAccountId:
          type: string
          description: |-
            You can set up multiple accounts with Braintree, and each account can settle funds into a different bank account.
            This parameter therefore allows you to control which of your bank accounts is used to receive settlement.
            This only applies to pay-ins and not payouts.
            If you pass it for payouts the value will be ignored.
            If not supplied for pay-ins, your default Braintree account will be used
        profileId:
          type: string
          description: |-
            You can set up multiple profiles with Braintree, where each profile shows the consumer a different logo and description during checkout on the Venmo app,
            and on the Venmo statement. This parameter therefore allows you to vary the consumer experience (for example, if you have multiple brands, you can display
            a different logo for each).
            This only applies to pay-ins and not payouts.
            If you pass it for payouts the value will be ignored.
            If not supplied for pay-ins, your default profile will be used

