          maxLength: 255
          example: 2ca14f87ff6f60976d18
        paymentHandleToken:
          type: string
          description: Required. This is the payment token generated by Paysafe that will be used for the Verification request.
          maxLength: 36
          example: 842778a0-03a2-11e9-8eb2-f2801f1b9fd1
        customerIp:
          type: string
          description: This is the customer's IP address.
          example: 111.111.111.111
        dupCheck:
          type: boolean
          description: |-
            This validates that this request is not a duplicate. A request is considered a duplicate if the merchantRefNum
            has already been used in a previous request within the past 90 days.
          default: true
        description:
          type: string
          description: This is a description of the transaction, provided by the merchant.
          maxLength: 255
          example: Consumer Card Verification
        paymentFacilitator:
          $ref: '#/components/schemas/PaymentFacilitator'
