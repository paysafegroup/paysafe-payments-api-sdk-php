          description: |-
            These are the first 6 digits of the network token.
            Example: 411111
        lastDigits:
          type: string
          description: |-
            These are the last four digits of the network token.
            Example: 6585
        status:
          $ref: '#/components/schemas/NetworkTokenStatus'
          description: The status of the network token
        expiry:
          $ref: '#/components/schemas/CardExpiry'
