    Authentication:
      x-package: Card.Threeds
      description: Authentication details for a payment.
      type: object
      properties:
        id:
          type: string
          description: 'This is the ID of authentication, returned in the response.'
          example: 5d4db3bc-34c9-417f-a051-0d992ad9284e
          readOnly: true
        eci:
          type: integer
          example: 5
          description: |-
            This is the Electronic Commerce Indicator code, which gets returned by the card issuer indicating whether the cardholder was successfully authenticated. Note that in some cases the eci value includes a leading zero, e.g., 01 or 02.
            **Visa**
              - 5 - Identifies a successfully authenticated transaction.
              - 6 - Identifies an attempts authenticated transaction.
              - 7 - Identifies a non-authenticated transaction.
            **Mastercard**
              - 2 - Identifies a successfully authenticated transaction.
              - 1 - Identifies an attempts authenticated transaction.
              - 0 - Identifies a non-authenticated transaction.
        cavv:
          type: string
          description: 'This is the Cardholder Authentication Verification Value, which gets returned by the card issuer, indicating that the transaction has been authenticated.'
          example: AAABBhkXYgAAAAACBxdiENhf7A+=
          maxLength: 80
        xid:
          type: string
          description: This is the transaction identifier returned by the card issuer.
          example: aWg4N1ZZOE53TkFrazJuMmkyRDA=
          maxLength: 40
          readOnly: true
        status:
          $ref: '#/components/schemas/AuthenticationStatus'
          readOnly: true
        merchantRefNum:
          type: string
          description: |-
            This is the merchant reference number created by 
            the merchant and submitted as part of the request. It must be unique for each request.
          example: merchantABC-123-authentications
          maxLength: 255
          readOnly: true
        threeDEnrollment:
          $ref: '#/components/schemas/ThreeDEnrollment'
          readOnly: true
        directoryServerTransactionId:
          type: string
          description: |-
            This is the unique directory server transaction ID required for Mastercard. <br> 
            **Note:** This is field is required when the card brand is Mastercard. This exists only for 3D Secure 2.
          example: 123e4567-e89b-12d3-a456-426655445674
          maxLength: 36
        threeDSecureVersion:
          type: string
          description: This is the 3D secure protocol version.
          example: 2.1.0
          maxLength: 8
          minLength: 5
        threeDResult:
          $ref: '#/components/schemas/ThreeDResult'
        signatureStatus:
          $ref: '#/components/schemas/ThreeDSignatureStatus'
          readOnly: true
        exemptionIndicator:
          $ref: '#/components/schemas/ThreeDsExemptionIndicator'
          example: TRA_EXEMPTION

