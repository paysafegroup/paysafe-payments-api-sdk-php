    PartialAuth:
      x-package: Payment
      description: |-
        [Partial Authorization](https://developer.paysafe.com/en/payments-api/#/schemas/partialAuth) service is a feature where a card issuer approves only a part of the amount requested by the merchant during a transaction.
        Instead of declining a transaction outright due to insufficient funds for example, the card issuer authorizes a lesser amount than what the merchant requested.
        This is an optional field and is only applicable for CARD transactions.
      type: object
      properties:
        allowPartialAuth:
          type: boolean
          description: This indicates whether the merchant requests the transaction to be processed as Partial Authorization.
        groupId:
          type: string
          description: |-
            This is the id of the Partial Authorization group identifying a single sale, which is returned in the initial Partial Auth response.
            The ID should be provided by the merchants in subsequent Partial Auth requests, in order to associate it to the Initial partially authorized transaction.
          maxLength: 36
        requestedAmount:
          type: integer
          description: |-
            'This is the amount of the request, in minor units. This value will contain the requested amount by the merchant.
            **Note:** Its value may differ from the amount value inside the payment object - in the case issuer partially authorized the required amount.'
          maximum: 99999999999
          readOnly: true
        processedAsPartialAuth:
          type: boolean
          readOnly: true
          description: |-
            'This indicates whether the transaction was actually processed by the issuer as Partial Authorization.
            - true - The transaction was processed as Partial Authorization.
            - false - The transaction was not processed as Partial Authorization even though it was requested by the merchant as such.'

