        bin:
          type: string
          description: The first 6 digits of the Apple Pay's DPAN (Device Primary Account Number) - Bank Identification Number (BIN)
          example: '411111'
          maxLength: 6
        lastDigits:
          type: string
          description: This is the last digits of the Apple Pay's token
          maxLength: 4
        expiry:
          $ref: '#/components/schemas/CardExpiry'
        status:
          $ref: '#/components/schemas/TokenStatus'
        subtype:
          $ref: '#/components/schemas/ApplePayTokenSubtype'
          description: The subtype of the Apple Pay token
          example: DEVICE
          readOnly: true

    GooglePayTokenDetails:
      x-package: GooglePay
      description: |-
        Google Pay token information. Returned when the stored payment method is a Google Pay token and token_type is GOOGLE_PAY.
      type: object
      properties:
        bin:
          type: string
          description: The first 6 digits of the Google Pay's DPAN (Device Primary Account Number) - Bank Identification Number (BIN)
          example: '411111'
        lastDigits:
          type: string
          description: This is the last digits of the Apple Pay's token
          maxLength: 4
        expiry:
          $ref: '#/components/schemas/CardExpiry'

    ## Confirm this
    ExternalNetworkTokenDetails:
      x-package: Card
