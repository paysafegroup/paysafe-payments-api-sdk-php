    PaymentHandleRequest:
      x-package: PaymentHandle
      description: Request to create a payment handle for tokenizing payment information
      type: object
      additionalProperties: true
      required:
        - merchantRefNum
        - amount
        - currencyCode
      properties:
        merchantRefNum:
          type: string
          description: The merchant reference number created by the merchant and submitted as part of the request. It must be unique for each request
          maxLength: 255
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        dupCheck:
          type: boolean
          description: This validates that this request is not a duplicate. A duplicate request is when the merchantRefNum has already been used in a previous request within the past 90 days.
          default: true
        accountId:
          type: string
          description: Required if you have more than one account configured for the same payment method and currency
          maxLength: 10
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        amount:
          type: integer
          description: The amount of the request in minor units (e.g., $10.99 = 1099)
          maximum: 99999999999
        merchantAccountId:
          type: string
          description: |-
            merchantAccountId determines which of your accounts with Paysafe should be debited or credited for this transaction. It gives you greater control over how you manage your Paysafe balances.
            Currently, this field is conditional; it should be left null in all cases, except when all the following conditions are met:
            - You are executing a payout to a Skrill wallet that might not be registered (i.e. the payee may not already have a Skrill wallet ).
            - You must populate this field if these conditions are met.<br>
            **Note:** Only applicable for SKRILL SCT.
