        <ul>
          <li>A regular Settlement, where the initial request was an Authorization that is to be settled.</li>
          <li>A Settlement that is split into multiple merchant accounts. This is applicable for those merchants whose accounts are configured to do so.</li>
          <li>A Settlement for the authorization with the full airline travel details for the AIRLINE Merchants.</li>
        </ul>
      type: object
      additionalProperties: true
      required:
        - merchantRefNum
      properties:
        merchantRefNum:
          type: string
          description: |-
            This is the merchant reference number created by the merchant and submitted as part of the request. It must be unique for each request.
          maxLength: 255
        amount:
          type: integer
          description: |-
            This is the amount of the request, in minor units.For example, to process US $10.99, this value should be 1099.
            Maximum: 99999999999
        dupCheck:
          type: boolean
          description: |-
            This validates that this request is not a duplicate.
            A request is considered a duplicate if the merchantRefNum has already been used in a previous request within the past 90 days.
            **Note:** This value defaults to true
          default: true
        splitpay:
          type: array
          description: Get splitpay
          items:
            $ref: '#/components/schemas/Splitpay'
        airlineTravelDetails:
          $ref: '#/components/schemas/AirlineTravelDetails'
          description: |-
