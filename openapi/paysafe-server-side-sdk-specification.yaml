    ReorderItemsIndicator:
      x-package: Card.Enums
      type: string
      description: Indicates whether the cardholder is reordering merchandise.
      enum: [ FIRST_TIME_ORDER, REORDER ]

    ShippingIndicator:
      x-package: Card.Enums
      type: string
      description: The shipping method for the transaction.
      enum: [ SHIP_TO_BILLING_ADDRESS, SHIP_TO_VERIFIED_ADDRESS, SHIP_TO_DIFFERENT_ADDRESS, SHIP_TO_STORE, DIGITAL_GOODS, TRAVEL_AND_EVENT_TICKETS, OTHER ]

    AccountChangedRange:
      x-package: Card.Enums
      type: string
      description: Length of time between the most recent change to the cardholder account and the current transaction.
      enum: [ DURING_TRANSACTION, LESS_THAN_THIRTY_DAYS, THIRTY_TO_SIXTY_DAYS, MORE_THAN_SIXTY_DAYS ]

    AccountCreatedRange:
      x-package: Card.Enums
      type: string
      description: Length of time between cardholder opening the account and the current transaction.
      enum: [ NO_ACCOUNT, DURING_TRANSACTION, LESS_THAN_THIRTY_DAYS, THIRTY_TO_SIXTY_DAYS, MORE_THAN_SIXTY_DAYS ]

    PasswordChangedRange:
      x-package: Card.Enums
      type: string
      description: Length of time between the most recent password change and the current transaction.
      enum: [ NO_CHANGE, DURING_TRANSACTION, LESS_THAN_THIRTY_DAYS, THIRTY_TO_SIXTY_DAYS, MORE_THAN_SIXTY_DAYS ]

    ShippingAddressUsageRange:
      x-package: Card.Enums
      type: string
      description: Range when the shipping address was first used.
      enum: [ CURRENT_TRANSACTION, LESS_THAN_THIRTY_DAYS, THIRTY_TO_SIXTY_DAYS, MORE_THAN_SIXTY_DAYS ]

    UserLoginAuthenticationMethod:
      x-package: Card.Enums
      type: string
      description: Mechanism used by the cardholder to authenticate to the 3DS Requestor.
      enum: [ NO_LOGIN, INTERNAL_CREDENTIALS, FEDERATED_ID, ISSUER_CREDENTIALS, THIRD_PARY_AUTHENTICATION, FIDO_AUTHENTICATOR ]

    PriorThreeDsAuthenticationMethod:
      x-package: Card.Enums
      type: string
      description: Mechanism used previously by the cardholder to authenticate to the 3DS Requestor.
      enum: [ FRICTIONLESS_AUTHENTICATION, ACS_CHALLENGE, AVS_VERIFIED, OTHER_ISSUER_METHOD ]

    VerificationIndicator:
      x-package: Common.Enums
      type: string
      description: Indicates whether a value has been verified.
      enum: [ NOT_VERIFIED, VERIFIED ]

    KycStatus:
      x-package: Common.Enums
      type: string
      description: |-
        This is the customer's KYC status for Paysafecash only.
        VERIFIED is sent as FULL to Paysafecash platform
        PARTIALLY_VERIFIED is sent as SIMPLE to Paysafecash platform
      enum:
        - VERIFIED
        - PARTIALLY_VERIFIED

    IdentityDocumentType:
      x-package: Common.Enums
      type: string
      description: Type of identity document.
      enum: [ PASSPORT, DRIVING_LICENSE, NATIONAL_IDENTITY, IDENTITY_CARD, TAX_IDENTIFICATION ]

    ShipMethod:
      x-package: Common.Enums
      type: string
      description: The method of shipment. N - Next Day, T - Two-Day, C - Lowest Cost, O - Other, S - Same Day.
      enum: [ N, T, C, O, S ]

    ExecutionMode:
      x-package: PaymentHandle.Enums
      type: string
      description: Specifies the action of the merchant server to complete the Payment.
      enum: [ SYNCHRONOUS, ASYNCHRONOUS ]

    PaymentSimulator:
      x-package: Common.Enums
      type: string
      description: |-
        Defines which Payment Simulator to use for processing test payment transactions.
        You can choose whether you want to simulate the actual end customer experience or you want to use a page,
        which lets you simulate all payment handle statuses. Possible values:
        <ul>
          <li>INTERNAL, which redirects to the status simulator page.</li>
          <li>EXTERNAL (default), which redirects/connects to the downstream payment method website, e.g. Skrill authentication page</li>
        </ul>
      enum: [ EXTERNAL, INTERNAL ]

    MonitorResponse:
      x-package: Monitor
      type: object
      description: The response returned by /v1/monitor endpoint.
      properties:
        status:
          $ref: '#/components/schemas/ServiceStatus'

    ServiceStatus:
      x-package: Monitor.Enums
      type: string
      description: This is the status of Payments API service.
      enum: [ READY ]

    LookUpPaymentMethodsResponse:
      x-package: PaymentMethod
      type: object
      description: The response returned by /v1/paymentmethods endpoint.
      properties:
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'

    PaymentMethod:
      x-package: PaymentMethod
      type: object
      description: |-
        Represents a payment method used for processing transactions. <p>
        This class includes details such as the type of payment method, the currency code associated with the payment, and the account Id linked to the payment method.
        </p>
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentType'
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        accountId:
          type: string
          description: Account Id in the Paysafe system

    SourceOfFunds:
      x-package: StandaloneCredit.Enums
      type: string
      description: |-
        This field contains the information representing the payment transaction funding source.
        Possible values: Credit, Debit, Prepaid, Cash, Deposit account, Credit account, Mobile money account
      enum: [ Credit, Debit, Prepaid, Cash, Deposit account, Credit account, Mobile money account ]

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic authentication using API username and password.
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication.
